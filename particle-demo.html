<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle System Demo - shagen.me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
        }

        .static-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: rgba(255, 255, 255, 0.8);
        }

        .static-fallback pre {
            font-family: monospace;
            font-size: 16px;
            line-height: 1.5;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <noscript>
        <div class="static-fallback">
            <pre>
     ______        __    __
    / ____/       / /   / /
   / /___        / /   / /
  /_____/       / /___/ /___
 ______/       /_____/_____/

            </pre>
        </div>
    </noscript>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Particle class
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 10;
                this.distance = 0;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }
            }
        }

        // Initialize particles in "SH" shape (Stefan Hagen initials)
        let particleArray = [];

        function init() {
            particleArray = [];

            // Create a grid of particles
            const gridSize = 15;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const width = 400;
            const height = 200;

            for (let y = 0; y < height; y += gridSize) {
                for (let x = 0; x < width; x += gridSize) {
                    let posX = centerX - width / 2 + x;
                    let posY = centerY - height / 2 + y;

                    // Create "S H" pattern
                    let shouldDraw = false;

                    // Letter S
                    if (x < 150) {
                        if ((y < 50 || (y > 75 && y < 125) || y > 150)) {
                            shouldDraw = true;
                        }
                        if (x < 30 && y > 50 && y < 75) {
                            shouldDraw = true;
                        }
                        if (x > 120 && y > 125 && y < 150) {
                            shouldDraw = true;
                        }
                    }

                    // Letter H
                    if (x > 250) {
                        if ((x < 280 || x > 370) || (y > 90 && y < 110)) {
                            shouldDraw = true;
                        }
                    }

                    if (shouldDraw) {
                        particleArray.push(new Particle(posX, posY));
                    }
                }
            }
        }

        // Mouse object
        const mouse = {
            x: null,
            y: null,
            radius: 100
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', function() {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particleArray.length; i++) {
                particleArray[i].draw();
                particleArray[i].update();
            }

            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        // Start
        init();
        animate();
    </script>
</body>
</html>
